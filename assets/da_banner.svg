<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="45%" stop-color="#0b1120"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="85%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.65" stroke-opacity="0.4"/>
      <circle cx="32" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .name-brand {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .role-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Consolas, monospace;
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 1.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      letter-spacing: 0.2px;
      fill: #cbd5e1;
    }
    .meta-code {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 11px;
      letter-spacing: 0.8px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
    }
  </style>

  <rect width="940" height="260" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="940" height="260" rx="18" fill="url(#techGrid)"/>

  <circle cx="150" cy="80" r="220" fill="url(#blueGlow)"/>
  <circle cx="780" cy="110" r="200" fill="url(#emeraldGlow)"/>

  <g transform="translate(42, 26)">
    <circle cx="6" cy="6" r="4.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="22" cy="6" r="4.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="38" cy="6" r="4.5" fill="#10b981" opacity="0.85"/>

    <rect x="58" y="-4" width="310" height="20" rx="10" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <circle cx="69" cy="6" r="3" fill="#38bdf8"/>
    <text x="78" y="10" fill="#94a3b8" class="meta-code">DATA ANALYST • TOOLS &amp; AUTOMATION</text>
  </g>

  <text x="42" y="98" fill="url(#titleGrad)" class="name-brand">
    PHONG
  </text>

  <g transform="translate(44, 126)">
    <text y="0" class="role-badge">
      <tspan fill="#38bdf8">DATA ANALYST</tspan>
      <tspan fill="#64748b" dx="6" font-weight="400">•</tspan>
      <tspan fill="#10b981" dx="6">BUSINESS INTELLIGENCE</tspan>
      <tspan fill="#64748b" dx="6" font-weight="400">•</tspan>
      <tspan fill="#a855f7" dx="6">TOOLS &amp; AUTOMATION</tspan>
    </text>
  </g>

  <text x="44" y="156" class="tagline-text">
    Transforming complex data into actionable business insights &amp; building powerful automated tools.
  </text>

  <g transform="translate(44, 192)">
    <rect width="186" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="4.5" fill="#ef4444"/>
    <text x="28" y="19.5" fill="#e2e8f0" class="pill-label">🎓 PTIT (IT Student)</text>
  </g>

  <g transform="translate(240, 192)">
    <rect width="210" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="4.5" fill="#38bdf8"/>
    <text x="28" y="19.5" fill="#e2e8f0" class="pill-label">📊 SQL • Power BI • Python</text>
  </g>

  <g transform="translate(460, 192)">
    <rect width="180" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="4.5" fill="#10b981"/>
    <text x="28" y="19.5" fill="#e2e8f0" class="pill-label">📈 RFM &amp; Cohort Analytics</text>
  </g>

  <g transform="translate(650, 192)">
    <rect width="168" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="4.5" fill="#a855f7"/>
    <text x="28" y="19.5" fill="#e2e8f0" class="pill-label">🌐 daophong.id.vn</text>
  </g>

  <g transform="translate(670, 26)">
    <rect width="226" height="142" rx="14" fill="#0a0f1d" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    
    <rect x="0" y="0" width="226" height="26" rx="14" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <circle cx="14" cy="13" r="3" fill="#10b981"/>
    <text x="24" y="17" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10px" font-weight="600">ANALYTICS &amp; TOOL LAB</text>
    <text x="180" y="17" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10px" font-weight="700">ACTIVE</text>

    <line x1="16" y1="56" x2="210" y2="56" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="16" y1="84" x2="210" y2="84" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="16" y1="112" x2="210" y2="112" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>

    <path d="M 16 118 Q 50 102 82 86 T 140 60 T 180 50 T 210 38 L 210 126 L 16 126 Z" fill="url(#chartAreaGrad)"/>
    <path d="M 16 118 Q 50 102 82 86 T 140 60 T 180 50 T 210 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="82" cy="86" r="3.5" fill="#818cf8" stroke="#0a0f1d" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="3.5" fill="#10b981" stroke="#0a0f1d" stroke-width="1.5"/>
    <circle cx="210" cy="38" r="4" fill="#34d399" stroke="#0a0f1d" stroke-width="1.5"/>

    <g transform="translate(162, 88)">
      <rect width="48" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="24" y="18" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11px" font-weight="700" text-anchor="middle">KPI ↑</text>
    </g>
    
    <text x="18" y="134" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5px">DATA INSIGHTS • TOOLS • DECISIONS</text>
  </g>
</svg>
