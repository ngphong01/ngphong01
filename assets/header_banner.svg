<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45"/>
      <circle cx="30" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', Consolas, monospace;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
    }
    .code-accent {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Card -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="900" height="240" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="120" cy="70" r="140" fill="url(#glowGrad)"/>
  <circle cx="820" cy="180" r="130" fill="#c084fc" fill-opacity="0.08"/>

  <!-- Terminal Dot Accent Bar -->
  <rect x="42" y="28" width="10" height="10" rx="5" fill="#ef4444" opacity="0.8"/>
  <rect x="58" y="28" width="10" height="10" rx="5" fill="#f59e0b" opacity="0.8"/>
  <rect x="74" y="28" width="10" height="10" rx="5" fill="#10b981" opacity="0.8"/>
  <text x="100" y="37" class="code-accent" opacity="0.85">~/portfolio/ngphong01 (main)</text>

  <!-- Title & Identity -->
  <text x="42" y="98" fill="#f8fafc" class="title-text">
    ĐÀO VĂN PHONG <tspan fill="url(#textGrad)">• ngphong01</tspan>
  </text>

  <!-- Subtitle / Roles -->
  <text x="44" y="132" class="sub-text">
    SOFTWARE DEVELOPER <tspan fill="#38bdf8">|</tspan> DATA ANALYST <tspan fill="#818cf8">|</tspan> SYSTEMS &amp; WEB ARCHITECTURE
  </text>

  <!-- Micro-quote / Mission statement -->
  <text x="44" y="160" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px">
    Building production-grade tools, modern fullstack platforms, and data-driven insights.
  </text>

  <!-- Quick Badges (Pills) -->
  <!-- Pill 1: PTIT -->
  <g transform="translate(44, 185)">
    <rect width="185" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#ef4444"/>
    <text x="26" y="18" fill="#e2e8f0" class="badge-label">🎓 PTIT Student (Hanoi)</text>
  </g>

  <!-- Pill 2: Portfolio Web -->
  <g transform="translate(240, 185)">
    <rect width="195" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#38bdf8"/>
    <text x="26" y="18" fill="#e2e8f0" class="badge-label">🌐 daophong.id.vn</text>
  </g>

  <!-- Pill 3: Focus Area -->
  <g transform="translate(446, 185)">
    <rect width="200" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10b981"/>
    <text x="26" y="18" fill="#e2e8f0" class="badge-label">🚀 Python • React • SQL</text>
  </g>

  <!-- Decorative Corner Binary / Tech Matrix -->
  <g fill="#334155" font-family="monospace" font-size="10px" opacity="0.6">
    <text x="780" y="60">01000100</text>
    <text x="780" y="75">01010110</text>
    <text x="780" y="90">01010000</text>
  </g>
</svg>
