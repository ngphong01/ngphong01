<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="rainbowGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="320" rx="16" fill="url(#bgGrad3D)" stroke="#1e293b" stroke-width="1.2"/>
  <circle cx="440" cy="160" r="260" fill="url(#rainbowGlow)"/>

  <!-- Isometric 3D Graph Mockup Illustration -->
  <g transform="translate(440, 150) scale(1.15)">
    <!-- Base grid isometric planes -->
    <g opacity="0.85">
      <!-- Row 1 -->
      <polygon points="-240,-40 -180,-70 -120,-40 -180,-10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <polygon points="-160,-80 -100,-110 -40,-80 -100,-50" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <polygon points="-80,-120 -20,-150 40,-120 -20,-90" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>

      <!-- 3D Columns / Blocks with Rainbow Palette -->
      <!-- Column A (Purple/Indigo) -->
      <g transform="translate(-160, 20)">
        <polygon points="0,-35 25,-48 50,-35 25,-22" fill="#a855f7"/>
        <polygon points="0,-35 25,-22 25,10 0,-3" fill="#9333ea"/>
        <polygon points="25,-22 50,-35 50,-3 25,10" fill="#7e22ce"/>
      </g>

      <!-- Column B (Blue/Cyan) -->
      <g transform="translate(-100, -10)">
        <polygon points="0,-55 25,-68 50,-55 25,-42" fill="#38bdf8"/>
        <polygon points="0,-55 25,-42 25,10 0,-3" fill="#0284c7"/>
        <polygon points="25,-42 50,-55 50,-3 25,10" fill="#0369a1"/>
      </g>

      <!-- Column C (Emerald/Teal) -->
      <g transform="translate(-40, -40)">
        <polygon points="0,-45 25,-58 50,-45 25,-32" fill="#34d399"/>
        <polygon points="0,-45 25,-32 25,10 0,-3" fill="#059669"/>
        <polygon points="25,-32 50,-45 50,-3 25,10" fill="#047857"/>
      </g>

      <!-- Column D (Amber/Gold) -->
      <g transform="translate(20, -70)">
        <polygon points="0,-65 25,-78 50,-65 25,-52" fill="#fbbf24"/>
        <polygon points="0,-65 25,-52 25,10 0,-3" fill="#d97706"/>
        <polygon points="25,-52 50,-65 50,-3 25,10" fill="#b45309"/>
      </g>

      <!-- Column E (Ruby/Coral) -->
      <g transform="translate(80, -100)">
        <polygon points="0,-50 25,-63 50,-50 25,-37" fill="#f43f5e"/>
        <polygon points="0,-50 25,-37 25,10 0,-3" fill="#e11d48"/>
        <polygon points="25,-37 50,-50 50,-3 25,10" fill="#be123c"/>
      </g>

      <!-- Extra isometric rows for depth -->
      <g transform="translate(-120, 50)">
        <polygon points="0,-25 25,-38 50,-25 25,-12" fill="#60a5fa"/>
        <polygon points="0,-25 25,-12 25,10 0,-3" fill="#2563eb"/>
        <polygon points="25,-12 50,-25 50,-3 25,10" fill="#1d4ed8"/>
      </g>
      <g transform="translate(-60, 20)">
        <polygon points="0,-40 25,-53 50,-40 25,-27" fill="#818cf8"/>
        <polygon points="0,-40 25,-27 25,10 0,-3" fill="#4f46e5"/>
        <polygon points="25,-27 50,-40 50,-3 25,10" fill="#3730a3"/>
      </g>
      <g transform="translate(0, -10)">
        <polygon points="0,-60 25,-73 50,-60 25,-47" fill="#ec4899"/>
        <polygon points="0,-60 25,-47 25,10 0,-3" fill="#db2777"/>
        <polygon points="25,-47 50,-60 50,-3 25,10" fill="#be185d"/>
      </g>
      <g transform="translate(60, -40)">
        <polygon points="0,-35 25,-48 50,-35 25,-22" fill="#2dd4bf"/>
        <polygon points="0,-35 25,-22 25,10 0,-3" fill="#0d9488"/>
        <polygon points="25,-22 50,-35 50,-3 25,10" fill="#0f766e"/>
      </g>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 36)">
    <rect width="260" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
    <text x="26" y="17" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5px" font-weight="600">3D CONTRIBUTION CALENDAR</text>
  </g>

  <!-- Status / Info text -->
  <text x="440" y="295" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px">
    ⚡ Visualizing continuous development, analytical modeling &amp; open-source contributions
  </text>
</svg>